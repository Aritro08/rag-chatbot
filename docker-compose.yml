services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.next
    env_file:
      - .env
    environment:
      FASTAPI_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
